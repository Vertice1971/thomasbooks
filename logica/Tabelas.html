<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela-Verdade com Negações</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f0f8ff;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            margin-left: 40px;
        }
        th, td {
            border: 1px solid #4682b4;
            padding: 12px;
            text-align: center;
            background-color: white;
        }
        th {
            background-color: #4682b4;
            color: white;
            font-weight: bold;
        }

        .row-number {
            border: none;
            background-color: transparent;
            font-size: 0.8em;
            text-align: right;
            padding-right: 10px;
            width: 30px;
        }

        .row-number-header {
            border: none;
            background-color: transparent;
            width: 30px;
            padding: 0;
        }

        input[type="text"] {
            padding: 10px;
            width: 400px;
            border: 2px solid #4682b4;
            border-radius: 5px;
            font-size: 16px;
            margin-bottom: 10px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
            background-color: #4682b4;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #36648b;
        }

        .keyboard {
            margin-top: 20px;
            padding: 15px;
            background-color: #e6f3ff;
            border-radius: 8px;
        }

        .error {
            color: #ff4444;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<h1 style="color: #4682b4;">Calculadora de Tabelas-Verdade</h1>
<h2 style="font-size: 0.6em; color: #555;">Tomás Cuesta. IES Juan de la Cierva</h2>

<p>Digite uma expressão lógica usando P, Q, R e os operadores (∧, ∨, ¬, →, ↔):</p>

<input type="text" id="expression" placeholder="Exemplo: (¬P ∧ Q) → ¬R">

<div class="keyboard">
    <button onclick="insertSymbol('P')">P</button>
    <button onclick="insertSymbol('Q')">Q</button>
    <button onclick="insertSymbol('R')">R</button>
    <button onclick="insertSymbol(' ∧ ')">∧</button>
    <button onclick="insertSymbol(' ∨ ')">∨</button>
    <button onclick="insertSymbol(' ¬ ')">¬</button>
    <button onclick="insertSymbol(' → ')">→</button>
    <button onclick="insertSymbol(' ↔ ')">↔</button>
    <button onclick="insertSymbol('(')">(</button>
    <button onclick="insertSymbol(')')">)</button>
    <button onclick="clearExpression()">Apagar</button>
</div>

<button onclick="generateTruthTable()" style="background-color: #5cb85c;">
    Gerar Tabela
</button>

<h2 style="color: #4682b4; margin-top: 25px;">Tabela-Verdade</h2>

<div id="tableContainer">
    <table id="truthTable">
        <thead>
            <tr id="headerRow"></tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
function insertSymbol(symbol) {
    const input = document.getElementById('expression');
    input.focus();
    input.value += symbol;
}

function clearExpression() {
    document.getElementById('expression').value = '';
    document.getElementById('truthTable').getElementsByTagName('thead')[0].innerHTML = '<tr id="headerRow"></tr>';
    document.getElementById('truthTable').getElementsByTagName('tbody')[0].innerHTML = '';
}

function generateTruthTable() {
    const expression = document.getElementById('expression').value.trim();
    const tableHeader = document.getElementById('headerRow');
    const tableBody = document.querySelector('#truthTable tbody');

    tableHeader.innerHTML = '';
    tableBody.innerHTML = '';

    if (!expression) {
        showError('Por favor, digite uma expressão válida');
        return;
    }

    try {
        const normalizedExpr = expression.replace(/¬\s+/g, '¬');

        const allNegations = new Set();
        const regex = /¬[PQR]/g;
        let match;

        while ((match = regex.exec(normalizedExpr)) !== null) {
            allNegations.add(match[0]);
        }

        const subExpressions = [];
        let exprCopy = normalizedExpr;

        while (exprCopy.includes('(')) {
            const start = exprCopy.indexOf('(');
            const end = exprCopy.indexOf(')');

            if (end === -1) {
                throw new Error('Parênteses não balanceados');
            }

            const subExpr = exprCopy.substring(start + 1, end).trim();
            subExpressions.push(subExpr);

            while ((match = regex.exec(subExpr)) !== null) {
                allNegations.add(match[0]);
            }

            exprCopy = exprCopy.substring(end + 1);
        }

        const emptyTh = document.createElement('th');
        emptyTh.className = 'row-number-header';
        emptyTh.textContent = '';
        tableHeader.appendChild(emptyTh);

        const variables = ['P', 'Q', 'R'];

        variables.forEach(variable => {
            const th = document.createElement('th');
            th.textContent = variable;
            tableHeader.appendChild(th);
        });

        const negations = Array.from(allNegations);

        negations.forEach(neg => {
            const th = document.createElement('th');
            th.textContent = neg;
            tableHeader.appendChild(th);
        });

        subExpressions.forEach((expr, index) => {
            const th = document.createElement('th');
            th.textContent = `(${expr})`;
            tableHeader.appendChild(th);
        });

        const finalTh = document.createElement('th');
        finalTh.textContent = normalizedExpr;
        tableHeader.appendChild(finalTh);

        const combinations = generateCombinations(variables);

        combinations.forEach((comb, index) => {
            const row = document.createElement('tr');

            const tdNum = document.createElement('td');
            tdNum.className = 'row-number';
            tdNum.textContent = index + 1;
            row.appendChild(tdNum);

            variables.forEach(variable => {
                const td = document.createElement('td');
                td.textContent = comb[variable] ? 'V' : 'F';
                row.appendChild(td);
            });

            negations.forEach(neg => {
                const variable = neg.charAt(1);
                const td = document.createElement('td');
                td.textContent = !comb[variable] ? 'V' : 'F';
                row.appendChild(td);
            });

            const subResults = {};

            subExpressions.forEach((expr, indexExpr) => {
                const result = evaluateExpression(expr, comb);
                subResults[indexExpr] = result;

                const td = document.createElement('td');
                td.textContent = result ? 'V' : 'F';
                row.appendChild(td);
            });

            let finalExpr = normalizedExpr;

            subExpressions.forEach((expr, indexExpr) => {
                finalExpr = finalExpr.replace(`(${expr})`, subResults[indexExpr]);
            });

            const finalResult = evaluateExpression(finalExpr, comb);

            const tdFinal = document.createElement('td');
            tdFinal.textContent = finalResult ? 'V' : 'F';
            row.appendChild(tdFinal);

            tableBody.appendChild(row);
        });

    } catch (error) {
        showError(`Erro: ${error.message}`);
    }
}

function evaluateExpression(expr, vars) {
    let replaced = expr
        .replace(/\bP\b/g, vars.P)
        .replace(/\bQ\b/g, vars.Q)
        .replace(/\bR\b/g, vars.R)
        .replace(/∧/g, '&&')
        .replace(/∨/g, '||')
        .replace(/¬/g, '!');

    let hasImplication = true;

    while (hasImplication) {
        const newReplaced = replaced.replace(/(.*)→(.*)/, (_, left, right) => {
            return `!(${left.trim()}) || (${right.trim()})`;
        });

        hasImplication = newReplaced !== replaced;
        replaced = newReplaced;
    }

    replaced = replaced.replace(/(.*)↔(.*)/, (_, left, right) => {
        return `(${left.trim()}) === (${right.trim()})`;
    });

    try {
        return eval(replaced);
    } catch (e) {
        console.error("Erro na expressão:", replaced);
        throw new Error("Expressão inválida");
    }
}

function generateCombinations(vars) {
    const combinations = [];
    const numRows = Math.pow(2, vars.length);

    for (let i = numRows - 1; i >= 0; i--) {
        const combination = {};

        vars.forEach((variable, index) => {
            combination[variable] = Boolean(i & (1 << (vars.length - 1 - index)));
        });

        combinations.push(combination);
    }

    return combinations;
}

function showError(message) {
    const existingError = document.querySelector('.error');

    if (existingError) {
        existingError.remove();
    }

    const errorDiv = document.createElement('div');
    errorDiv.className = 'error';
    errorDiv.textContent = message;

    document.body.appendChild(errorDiv);
}
</script>

</body>
</html>
